name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/run-tests.sh
      - run: scripts/build-simple.sh
        env:
          SIMPLE_ARCHS: 'arm64 x86_64'
