name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: MACSHOT_KEEP_TEST_RESULTS=1 scripts/run-tests.sh
      - name: Ensure release packaging rejects ad-hoc signing
        run: |
          set +e
          output=$(SIMPLE_SIGNING_IDENTITY=- scripts/package-release.sh 2>&1)
          status=$?
          set -e
          test "$status" -eq 2
          case "$output" in
            *"Refusing to create a release with an ad-hoc signature."*) ;;
            *) printf '%s\n' "$output"; exit 1 ;;
          esac
          version=$(awk -F' = ' '/MARKETING_VERSION = [0-9]+\.[0-9]+\.[0-9]+;/ { gsub(/;/, "", $2); print $2; exit }' macshot.xcodeproj/project.pbxproj)
          test -n "$version"
          test ! -e "dist/release-$version"
      - run: scripts/build-simple.sh
        env:
          SIMPLE_ARCHS: 'arm64 x86_64'
